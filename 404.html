<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E1514">
<title>404 | رِواء</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1514;--tx:#E6EDEA;--mut:#A9BBB5;--em:#2FA084;--gold:#C9A961;
 --glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.18);--shine:rgba(255,255,255,.28);color-scheme:dark}
@media (prefers-color-scheme:light){
 :root{--bg:#F6F4EE;--tx:#1B2623;--mut:#5E6D68;--glass:rgba(255,255,255,.55);--edge:rgba(255,255,255,.85);--shine:rgba(255,255,255,.95);color-scheme:light}
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);overflow:hidden;
 font:400 16px/1.8 'IBM Plex Sans Arabic',Tahoma,sans-serif;
 display:flex;align-items:center;justify-content:center;
 padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));position:relative}

/* أضواء خلفية */
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.75;pointer-events:none;animation:drift 14s ease-in-out infinite alternate}
.o1{width:300px;height:300px;background:var(--em);top:-90px;right:-70px}
.o2{width:340px;height:340px;background:var(--gold);bottom:-120px;left:-90px;opacity:.5;animation-delay:-5s}
.o3{width:200px;height:200px;background:#4fd1b0;top:42%;left:30%;opacity:.28;animation-delay:-9s}
@keyframes drift{to{transform:translate(34px,-26px) scale(1.15)}}

/* شعاع ضوء */
.ray{position:fixed;top:-20%;right:18%;width:140px;height:140%;pointer-events:none;
 background:linear-gradient(180deg,rgba(255,235,180,.22),transparent 70%);
 transform:rotate(18deg);filter:blur(22px);animation:ray 7s ease-in-out infinite alternate}
@keyframes ray{from{opacity:.35}to{opacity:.9}}

/* بطاقة زجاجية */
.glass{position:relative;width:100%;max-width:380px;text-align:center;padding:34px 26px 30px;border-radius:30px;
 background:linear-gradient(145deg,var(--shine),var(--glass) 38%,var(--glass));
 border:1px solid var(--edge);
 -webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);
 box-shadow:0 18px 50px rgba(0,0,0,.35),inset 0 1px 0 var(--shine),inset 0 -1px 0 rgba(255,255,255,.06);
 animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 48%,transparent 62%);
 background-size:250% 100%;animation:sheen 6s ease-in-out infinite}
@keyframes sheen{0%{background-position:130% 0}60%,100%{background-position:-60% 0}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}}

.logo{width:92px;height:92px;border-radius:24px;display:block;margin:0 auto 14px;
 box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 0 1px var(--edge);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}

.code{font-family:Amiri,'Traditional Arabic',serif;font-weight:700;font-size:92px;line-height:1.05;letter-spacing:4px;direction:ltr;
 background:linear-gradient(180deg,#f3dfa6,var(--gold) 55%,#a98a45);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 22px rgba(201,169,97,.45))}
h1{font-family:Amiri,'Traditional Arabic',serif;font-size:30px;margin:2px 0 6px}
p{color:var(--mut);font-size:15px;margin-bottom:24px}
a.btn{display:inline-block;padding:12px 32px;border-radius:999px;text-decoration:none;font-weight:600;color:#04100C;
 background:linear-gradient(135deg,#46c9a4,var(--em));
 box-shadow:0 8px 22px rgba(47,160,132,.45),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .2s}
a.btn:active{transform:scale(.96)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="ray"></div>
<main class="glass">
 <img class="logo" src="/app/icon-192.png" alt="رِواء">
 <div class="code">404</div>
 <h1>الصفحة غير موجودة</h1>
 <p>ربما تغيّر الرابط أو لم تعد الصفحة متاحة.</p>
 <a class="btn" href="/app/">العودة إلى رِواء</a>
</main>
</body>
</html>
