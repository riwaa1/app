# Fichier à placer dans : .github/workflows/build-apk.yml
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Préparer le dossier web
        run: |
          mkdir -p www
          cp index.html www/
          for f in manifest.json icon-maskable-192.png; do
            [ -f "$f" ] && cp "$f" www/ || true
          done

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Créer le projet Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          npx cap init "رواء" com.riwaa.app --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Compiler le APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier le APK
        uses: actions/upload-artifact@v4
        with:
          name: riwaa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
