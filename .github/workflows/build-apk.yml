name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-apk.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        run: |
          set -e
          SRC="$GITHUB_WORKSPACE"
          mkdir -p /tmp/cap/www && cd /tmp/cap
          cp "$SRC/index.html" "$SRC/manifest.json" www/
          cp "$SRC"/icon-*.png www/
          SND=0
          [ -f "$SRC/adhan.mp3" ] && SND=1
          sed -i "s/__SOUND__/$SND/" www/index.html
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7
          npx cap init "رِواء" com.riwaa.app --web-dir=www
          npx cap add android
          R=android/app/src/main/res
          if [ "$SND" = "1" ]; then mkdir -p $R/raw; cp "$SRC/adhan.mp3" $R/raw/adhan.mp3; fi
          PKG=android/app/src/main/java/com/riwaa/app
          mkdir -p $PKG
          cat > $PKG/AlarmReceiver.java <<'JAVA'
          package com.riwaa.app;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class AlarmReceiver extends BroadcastReceiver {
            static final String CH = "riwaa_alarm_ring";
            static final int NID = 7001;

            @Override
            public void onReceive(Context ctx, Intent intent) {
              String data = intent.getStringExtra("data");
              if (data == null) data = "{}";
              int rc = intent.getIntExtra("rc", 0);
              String label = "تنبيه";
              try {
                String l = new JSONObject(data).optString("l", "");
                if (l.length() > 0) label = l;
              } catch (Exception ex) {}
              Intent open = new Intent(ctx, MainActivity.class);
              open.putExtra("riwaa_alarm", data);
              open.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
              PendingIntent pi = PendingIntent.getActivity(ctx, rc, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
              Uri snd = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);
              Notification.Builder b;
              if (Build.VERSION.SDK_INT >= 26) {
                NotificationChannel ch = new NotificationChannel(CH, "تنبيهات المنبّه", NotificationManager.IMPORTANCE_HIGH);
                ch.setSound(snd, new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build());
                ch.enableVibration(true);
                ch.setVibrationPattern(new long[]{0, 600, 250, 600, 250, 600});
                ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                nm.createNotificationChannel(ch);
                b = new Notification.Builder(ctx, CH);
              } else {
                b = new Notification.Builder(ctx).setSound(snd).setVibrate(new long[]{0, 600, 250, 600}).setPriority(Notification.PRIORITY_MAX);
              }
              b.setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                .setContentTitle(label)
                .setContentText("حان وقت التنبيه")
                .setCategory(Notification.CATEGORY_ALARM)
                .setContentIntent(pi)
                .setFullScreenIntent(pi, true)
                .setAutoCancel(true)
                .setVisibility(Notification.VISIBILITY_PUBLIC);
              Notification n = b.build();
              n.flags |= Notification.FLAG_INSISTENT;
              nm.notify(NID, n);
              try { ctx.startActivity(open); } catch (Exception ex) {}
            }

            static PendingIntent opIntent(Context c, int rc, String data, int flags) {
              Intent in = new Intent(c, AlarmReceiver.class);
              if (data != null) {
                in.putExtra("data", data);
                in.putExtra("rc", rc);
              }
              return PendingIntent.getBroadcast(c, rc, in, flags | PendingIntent.FLAG_IMMUTABLE);
            }

            static void set(Context c, int rc, long at, String data) {
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              Intent open = new Intent(c, MainActivity.class);
              PendingIntent show = PendingIntent.getActivity(c, rc, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              am.setAlarmClock(new AlarmManager.AlarmClockInfo(at, show), opIntent(c, rc, data, PendingIntent.FLAG_UPDATE_CURRENT));
            }

            static void cancelAll(Context c) {
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              JSONArray arr = load(c);
              for (int i = 0; i < arr.length(); i++) {
                try {
                  int rc = arr.getJSONObject(i).getInt("rc");
                  PendingIntent p = opIntent(c, rc, null, PendingIntent.FLAG_NO_CREATE);
                  if (p != null) {
                    am.cancel(p);
                    p.cancel();
                  }
                } catch (Exception ex) {}
              }
              save(c, new JSONArray());
            }

            static JSONArray load(Context c) {
              try {
                return new JSONArray(c.getSharedPreferences("riwaa_alarms", 0).getString("list", "[]"));
              } catch (Exception ex) {
                return new JSONArray();
              }
            }

            static void save(Context c, JSONArray a) {
              c.getSharedPreferences("riwaa_alarms", 0).edit().putString("list", a.toString()).apply();
            }
          }
          JAVA
          cat > $PKG/BootReceiver.java <<'JAVA'
          package com.riwaa.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class BootReceiver extends BroadcastReceiver {
            @Override
            public void onReceive(Context c, Intent i) {
              JSONArray arr = AlarmReceiver.load(c);
              long now = System.currentTimeMillis();
              for (int k = 0; k < arr.length(); k++) {
                try {
                  JSONObject o = arr.getJSONObject(k);
                  long at = o.getLong("at");
                  if (at > now) AlarmReceiver.set(c, o.getInt("rc"), at, o.getString("d"));
                } catch (Exception ex) {}
              }
            }
          }
          JAVA
          cat > $PKG/AlarmPlugin.java <<'JAVA'
          package com.riwaa.app;

          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONArray;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "RiwaaAlarm")
          public class AlarmPlugin extends Plugin {
            public static JSObject pending = null;

            @PluginMethod
            public void schedule(PluginCall call) {
              Context c = getContext();
              AlarmReceiver.cancelAll(c);
              JSArray arr = call.getArray("alarms");
              JSONArray store = new JSONArray();
              long now = System.currentTimeMillis();
              if (arr != null) {
                for (int i = 0; i < arr.length(); i++) {
                  try {
                    JSONObject o = arr.getJSONObject(i);
                    long at = o.getLong("at");
                    int rc = o.getInt("rc");
                    if (at <= now) continue;
                    AlarmReceiver.set(c, rc, at, o.toString());
                    JSONObject en = new JSONObject();
                    en.put("rc", rc);
                    en.put("at", at);
                    en.put("d", o.toString());
                    store.put(en);
                  } catch (Exception ex) {}
                }
              }
              AlarmReceiver.save(c, store);
              call.resolve();
            }

            @PluginMethod
            public void cancelAll(PluginCall call) {
              AlarmReceiver.cancelAll(getContext());
              call.resolve();
            }

            @PluginMethod
            public void getPending(PluginCall call) {
              JSObject r = new JSObject();
              if (pending != null) {
                r.put("alarm", pending);
                pending = null;
              }
              call.resolve(r);
            }

            @PluginMethod
            public void fullScreenStatus(PluginCall call) {
              boolean ok = true;
              if (Build.VERSION.SDK_INT >= 34) {
                NotificationManager nm = (NotificationManager) getContext().getSystemService(Context.NOTIFICATION_SERVICE);
                ok = nm.canUseFullScreenIntent();
              }
              JSObject r = new JSObject();
              r.put("granted", ok);
              call.resolve(r);
            }

            @PluginMethod
            public void openFullScreenSettings(PluginCall call) {
              try {
                Uri pkg = Uri.parse("package:" + getContext().getPackageName());
                Intent i;
                if (Build.VERSION.SDK_INT >= 34) {
                  i = new Intent(Settings.ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT, pkg);
                } else {
                  i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, pkg);
                }
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(i);
              } catch (Exception ex) {}
              call.resolve();
            }
          }
          JAVA
          cat > $PKG/MainActivity.java <<'JAVA'
          package com.riwaa.app;

          import android.app.NotificationManager;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.JSObject;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(AlarmPlugin.class);
              super.onCreate(savedInstanceState);
              try {
                getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
              } catch (Exception ex) {}
              handleAlarm(getIntent());
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              setIntent(intent);
              handleAlarm(intent);
            }

            private void handleAlarm(Intent i) {
              if (i == null) return;
              String d = i.getStringExtra("riwaa_alarm");
              if (d == null) return;
              i.removeExtra("riwaa_alarm");
              try {
                AlarmPlugin.pending = new JSObject(d);
              } catch (Exception ex) {}
              if (Build.VERSION.SDK_INT >= 27) {
                setShowWhenLocked(true);
                setTurnScreenOn(true);
              } else {
                getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON);
              }
              ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).cancel(AlarmReceiver.NID);
            }

            @Override
            public void onStop() {
              super.onStop();
              if (Build.VERSION.SDK_INT >= 27) {
                setShowWhenLocked(false);
                setTurnScreenOn(false);
              }
            }
          }
          JAVA
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>\n</manifest>#' $M
          sed -i 's#</application>#    <receiver android:name="com.riwaa.app.AlarmReceiver" android:exported="false"/>\n    <receiver android:name="com.riwaa.app.BootReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter></receiver>\n</application>#' $M
          rm -rf $R/mipmap-anydpi-v26
          for n in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p $R/mipmap-$n
            for f in ic_launcher ic_launcher_round; do cp www/icon-192.png $R/mipmap-$n/$f.png; done
          done
          for f in ic_launcher ic_launcher_round; do cp www/icon-512.png $R/mipmap-xxxhdpi/$f.png; done
          npx cap sync android
          if [ -f "$SRC/debug.keystore" ]; then mkdir -p ~/.android; cp "$SRC/debug.keystore" ~/.android/debug.keystore; fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: riwaa-apk
          path: /tmp/cap/android/app/build/outputs/apk/debug/app-debug.apk
          
