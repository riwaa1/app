name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-apk.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        run: |
          set -e
          SRC="$GITHUB_WORKSPACE"
          mkdir -p /tmp/cap/www && cd /tmp/cap
          cp "$SRC/index.html" "$SRC/manifest.json" www/
          cp "$SRC"/icon-*.png www/
          mkdir -p www/audio/Alafasy_128kbps
          for sa in 2:255 2:285 2:286 1:1 1:2 1:3 1:4 1:5 1:6 1:7 112:1 112:2 112:3 112:4 113:1 113:2 113:3 113:4 113:5 114:1 114:2 114:3 114:4 114:5 114:6 67:1 67:2 67:3 67:4 13:28 94:1 94:2 94:3 94:4 94:5 94:6 94:7 94:8; do
            s=${sa%%:*}; a=${sa##*:}; f=$(printf "%03d%03d" $s $a)
            curl -fsSL --retry 3 -o www/audio/Alafasy_128kbps/$f.mp3 "https://everyayah.com/data/Alafasy_128kbps/$f.mp3" || rm -f www/audio/Alafasy_128kbps/$f.mp3
          done
          SND=0
          [ -f "$SRC/adhan.mp3" ] && SND=1
          sed -i "s/__SOUND__/$SND/" www/index.html
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7
          npx cap init "رِواء" com.riwaa.app --web-dir=www
          npx cap add android
          R=android/app/src/main/res
          if [ "$SND" = "1" ]; then mkdir -p $R/raw; cp "$SRC/adhan.mp3" $R/raw/adhan.mp3; fi
          PKG=android/app/src/main/java/com/riwaa/app
          mkdir -p $PKG
          cat > $PKG/AlarmReceiver.java <<'JAVA'
          package com.riwaa.app;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class AlarmReceiver extends BroadcastReceiver {
            static final String CH = "riwaa_alarm_ring";
            static final int NID = 7001;

            @Override
            public void onReceive(Context ctx, Intent intent) {
              String data = intent.getStringExtra("data");
              if (data == null) data = "{}";
              int rc = intent.getIntExtra("rc", 0);
              int nag = intent.getIntExtra("nag", 0);
              JSONObject o;
              try {
                o = new JSONObject(data);
              } catch (Exception ex) {
                o = new JSONObject();
              }
              boolean prayer = "p".equals(o.optString("kd", "a"));
              String label;
              String text;
              if (prayer) {
                label = "حان وقت صلاة " + o.optString("n", "");
                text = "حيّ على الصلاة";
              } else {
                label = o.optString("l", "");
                if (label.length() == 0) label = "تنبيه";
                text = "حان وقت التنبيه";
              }
              Intent open = new Intent(ctx, MainActivity.class);
              open.putExtra("riwaa_alarm", data);
              open.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
              PendingIntent pi = PendingIntent.getActivity(ctx, rc, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              PendingIntent stopPi = PendingIntent.getBroadcast(ctx, 7003, new Intent(ctx, StopReceiver.class), PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
              String chId = CH;
              String chName = "تنبيهات المنبّه";
              Uri snd = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);
              int usage = AudioAttributes.USAGE_ALARM;
              if (prayer) {
                int rid = ctx.getResources().getIdentifier("adhan", "raw", ctx.getPackageName());
                chName = "الأذان وأوقات الصلاة";
                usage = AudioAttributes.USAGE_NOTIFICATION;
                if (rid != 0) {
                  snd = Uri.parse("android.resource://" + ctx.getPackageName() + "/" + rid);
                  chId = "riwaa_prayer_s1";
                } else {
                  snd = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                  chId = "riwaa_prayer_n1";
                }
              }
              boolean quiet = prayer && nag > 0;
              if (quiet) {
                chId = "riwaa_prayer_rm1";
                chName = "تذكير الأذان المتكرر";
              }
              Notification.Builder b;
              if (Build.VERSION.SDK_INT >= 26) {
                NotificationChannel ch = new NotificationChannel(chId, chName, NotificationManager.IMPORTANCE_HIGH);
                if (quiet) {
                  ch.setSound(null, null);
                } else {
                  ch.setSound(snd, new AudioAttributes.Builder().setUsage(usage).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build());
                }
                ch.enableVibration(true);
                ch.setVibrationPattern(new long[]{0, 600, 250, 600, 250, 600});
                ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                nm.createNotificationChannel(ch);
                b = new Notification.Builder(ctx, chId);
              } else {
                b = new Notification.Builder(ctx).setVibrate(new long[]{0, 600, 250, 600}).setPriority(Notification.PRIORITY_MAX);
                if (!quiet) b.setSound(snd);
              }
              b.setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                .setContentTitle(label)
                .setContentText(text)
                .setCategory(prayer ? Notification.CATEGORY_REMINDER : Notification.CATEGORY_ALARM)
                .setContentIntent(pi)
                .setAutoCancel(false)
                .setOngoing(true)
                .setDeleteIntent(stopPi)
                .setOnlyAlertOnce(false)
                .addAction(android.R.drawable.ic_menu_close_clear_cancel, "إيقاف", stopPi)
                .setVisibility(Notification.VISIBILITY_PUBLIC);
              if (nag == 0) b.setFullScreenIntent(pi, true);
              Notification n = b.build();
              if (!prayer) n.flags |= Notification.FLAG_INSISTENT;
              nm.notify(prayer ? NID + 1 : NID, n);
              int max = prayer ? 20 : 40;
              if (nag < max) scheduleNag(ctx, data, rc, nag + 1, prayer ? 60000L : 30000L);
              if (nag == 0) {
                try { ctx.startActivity(open); } catch (Exception ex) {}
              }
            }

            static final int NAG_RC = 7777;

            static void scheduleNag(Context c, String data, int rc, int nag, long delay) {
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              Intent in = new Intent(c, AlarmReceiver.class);
              in.putExtra("data", data);
              in.putExtra("rc", rc);
              in.putExtra("nag", nag);
              PendingIntent p = PendingIntent.getBroadcast(c, NAG_RC, in, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, System.currentTimeMillis() + delay, p);
            }

            static void cancelNag(Context c) {
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              PendingIntent p = PendingIntent.getBroadcast(c, NAG_RC, new Intent(c, AlarmReceiver.class), PendingIntent.FLAG_NO_CREATE | PendingIntent.FLAG_IMMUTABLE);
              if (p != null) {
                am.cancel(p);
                p.cancel();
              }
            }

            static PendingIntent opIntent(Context c, int rc, String data, int flags) {
              Intent in = new Intent(c, AlarmReceiver.class);
              if (data != null) {
                in.putExtra("data", data);
                in.putExtra("rc", rc);
              }
              return PendingIntent.getBroadcast(c, rc, in, flags | PendingIntent.FLAG_IMMUTABLE);
            }

            static void set(Context c, int rc, long at, String data) {
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              Intent open = new Intent(c, MainActivity.class);
              PendingIntent show = PendingIntent.getActivity(c, rc, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              am.setAlarmClock(new AlarmManager.AlarmClockInfo(at, show), opIntent(c, rc, data, PendingIntent.FLAG_UPDATE_CURRENT));
            }

            static void cancelAll(Context c) {
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              JSONArray arr = load(c);
              for (int i = 0; i < arr.length(); i++) {
                try {
                  int rc = arr.getJSONObject(i).getInt("rc");
                  PendingIntent p = opIntent(c, rc, null, PendingIntent.FLAG_NO_CREATE);
                  if (p != null) {
                    am.cancel(p);
                    p.cancel();
                  }
                } catch (Exception ex) {}
              }
              save(c, new JSONArray());
            }

            static JSONArray load(Context c) {
              try {
                return new JSONArray(c.getSharedPreferences("riwaa_alarms", 0).getString("list", "[]"));
              } catch (Exception ex) {
                return new JSONArray();
              }
            }

            static void save(Context c, JSONArray a) {
              c.getSharedPreferences("riwaa_alarms", 0).edit().putString("list", a.toString()).apply();
            }
          }
          JAVA
          cat > $PKG/BootReceiver.java <<'JAVA'
          package com.riwaa.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class BootReceiver extends BroadcastReceiver {
            @Override
            public void onReceive(Context c, Intent i) {
              JSONArray arr = AlarmReceiver.load(c);
              long now = System.currentTimeMillis();
              for (int k = 0; k < arr.length(); k++) {
                try {
                  JSONObject o = arr.getJSONObject(k);
                  long at = o.getLong("at");
                  if (at > now) AlarmReceiver.set(c, o.getInt("rc"), at, o.getString("d"));
                } catch (Exception ex) {}
              }
            }
          }
          JAVA
          cat > $PKG/AlarmPlugin.java <<'JAVA'
          package com.riwaa.app;

          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.PowerManager;
          import android.provider.Settings;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONArray;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "RiwaaAlarm")
          public class AlarmPlugin extends Plugin {
            public static JSObject pending = null;

            @PluginMethod
            public void schedule(PluginCall call) {
              Context c = getContext();
              AlarmReceiver.cancelAll(c);
              JSArray arr = call.getArray("alarms");
              JSONArray store = new JSONArray();
              long now = System.currentTimeMillis();
              if (arr != null) {
                for (int i = 0; i < arr.length(); i++) {
                  try {
                    JSONObject o = arr.getJSONObject(i);
                    long at = o.getLong("at");
                    int rc = o.getInt("rc");
                    if (at <= now) continue;
                    AlarmReceiver.set(c, rc, at, o.toString());
                    JSONObject en = new JSONObject();
                    en.put("rc", rc);
                    en.put("at", at);
                    en.put("d", o.toString());
                    store.put(en);
                  } catch (Exception ex) {}
                }
              }
              AlarmReceiver.save(c, store);
              call.resolve();
            }

            @PluginMethod
            public void cancelAll(PluginCall call) {
              AlarmReceiver.cancelAll(getContext());
              call.resolve();
            }

            @PluginMethod
            public void getPending(PluginCall call) {
              JSObject r = new JSObject();
              if (pending != null) {
                r.put("alarm", pending);
                pending = null;
              }
              call.resolve(r);
            }

            @PluginMethod
            public void fullScreenStatus(PluginCall call) {
              boolean ok = true;
              if (Build.VERSION.SDK_INT >= 34) {
                NotificationManager nm = (NotificationManager) getContext().getSystemService(Context.NOTIFICATION_SERVICE);
                ok = nm.canUseFullScreenIntent();
              }
              JSObject r = new JSObject();
              r.put("granted", ok);
              call.resolve(r);
            }

            @PluginMethod
            public void dismiss(PluginCall call) {
              NotificationManager nm = (NotificationManager) getContext().getSystemService(Context.NOTIFICATION_SERVICE);
              nm.cancel(AlarmReceiver.NID);
              nm.cancel(AlarmReceiver.NID + 1);
              AlarmReceiver.cancelNag(getContext());
              call.resolve();
            }

            @PluginMethod
            public void batteryStatus(PluginCall call) {
              boolean ok = true;
              if (Build.VERSION.SDK_INT >= 23) {
                PowerManager pm = (PowerManager) getContext().getSystemService(Context.POWER_SERVICE);
                ok = pm.isIgnoringBatteryOptimizations(getContext().getPackageName());
              }
              JSObject r = new JSObject();
              r.put("ignoring", ok);
              call.resolve(r);
            }

            @PluginMethod
            public void openBatterySettings(PluginCall call) {
              Uri pkg = Uri.parse("package:" + getContext().getPackageName());
              try {
                Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, pkg);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(i);
              } catch (Exception ex) {
                try {
                  Intent i2 = new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS);
                  i2.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getContext().startActivity(i2);
                } catch (Exception ex2) {}
              }
              call.resolve();
            }

            @PluginMethod
            public void openAppSettings(PluginCall call) {
              try {
                Intent i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getContext().getPackageName()));
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(i);
              } catch (Exception ex) {}
              call.resolve();
            }

            @PluginMethod
            public void openFullScreenSettings(PluginCall call) {
              try {
                Uri pkg = Uri.parse("package:" + getContext().getPackageName());
                Intent i;
                if (Build.VERSION.SDK_INT >= 34) {
                  i = new Intent(Settings.ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT, pkg);
                } else {
                  i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, pkg);
                }
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(i);
              } catch (Exception ex) {}
              call.resolve();
            }
          }
          JAVA
          cat > $PKG/MainActivity.java <<'JAVA'
          package com.riwaa.app;

          import android.app.NotificationManager;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.JSObject;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(AlarmPlugin.class);
              super.onCreate(savedInstanceState);
              try {
                getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
              } catch (Exception ex) {}
              handleAlarm(getIntent());
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              setIntent(intent);
              handleAlarm(intent);
            }

            private void handleAlarm(Intent i) {
              if (i == null) return;
              String d = i.getStringExtra("riwaa_alarm");
              if (d == null) return;
              i.removeExtra("riwaa_alarm");
              try {
                AlarmPlugin.pending = new JSObject(d);
              } catch (Exception ex) {}
              if (Build.VERSION.SDK_INT >= 27) {
                setShowWhenLocked(true);
                setTurnScreenOn(true);
              } else {
                getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON);
              }
              NotificationManager nmg = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
              nmg.cancel(AlarmReceiver.NID);
              nmg.cancel(AlarmReceiver.NID + 1);
              AlarmReceiver.cancelNag(this);
            }

            @Override
            public void onStart() {
              super.onStart();
              AlarmReceiver.cancelNag(this);
              ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).cancel(AlarmReceiver.NID + 1);
            }

            @Override
            public void onStop() {
              super.onStop();
              if (Build.VERSION.SDK_INT >= 27) {
                setShowWhenLocked(false);
                setTurnScreenOn(false);
              }
            }
          }
          JAVA
          cat > $PKG/StopReceiver.java <<'JAVA'
          package com.riwaa.app;

          import android.app.NotificationManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class StopReceiver extends BroadcastReceiver {
            @Override
            public void onReceive(Context c, Intent i) {
              NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
              nm.cancel(AlarmReceiver.NID);
              nm.cancel(AlarmReceiver.NID + 1);
          
