name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-apk.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        run: |
          set -e
          SRC="$GITHUB_WORKSPACE"
          mkdir -p /tmp/cap/www && cd /tmp/cap
          cp "$SRC/index.html" "$SRC/manifest.json" www/
          cp "$SRC"/icon-*.png www/
          mkdir -p www/audio/Alafasy_128kbps
          for sa in 2:255 2:285 2:286 1:1 1:2 1:3 1:4 1:5 1:6 1:7 112:1 112:2 112:3 112:4 113:1 113:2 113:3 113:4 113:5 114:1 114:2 114:3 114:4 114:5 114:6 67:1 67:2 67:3 67:4 13:28 94:1 94:2 94:3 94:4 94:5 94:6 94:7 94:8; do
            s=${sa%%:*}; a=${sa##*:}; f=$(printf "%03d%03d" $s $a)
            curl -fsSL --retry 3 -o www/audio/Alafasy_128kbps/$f.mp3 "https://everyayah.com/data/Alafasy_128kbps/$f.mp3" || rm -f www/audio/Alafasy_128kbps/$f.mp3
          done
          SND=0
          [ -f "$SRC/adhan.mp3" ] && SND=1
          sed -i "s/__SOUND__/$SND/" www/index.html
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7
          npx cap init "رِواء" com.riwaa.app --web-dir=www
          npx cap add android
          R=android/app/src/main/res
          if [ "$SND" = "1" ]; then mkdir -p $R/raw; cp "$SRC/adhan.mp3" $R/raw/adhan.mp3; fi
          bash "$SRC/.github/native-android.sh"
          rm -rf $R/mipmap-anydpi-v26
          for n in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p $R/mipmap-$n
            for f in ic_launcher ic_launcher_round; do cp www/icon-192.png $R/mipmap-$n/$f.png; done
          done
          for f in ic_launcher ic_launcher_round; do cp www/icon-512.png $R/mipmap-xxxhdpi/$f.png; done
          npx cap sync android
          if [ -f "$SRC/debug.keystore" ]; then mkdir -p ~/.android; cp "$SRC/debug.keystore" ~/.android/debug.keystore; fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: riwaa-apk
          path: /tmp/cap/android/app/build/outputs/apk/debug/app-debug.apk
          
