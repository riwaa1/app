name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-apk.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        run: |
          set -e
          SRC="$GITHUB_WORKSPACE"
          mkdir -p /tmp/cap/www && cd /tmp/cap
          cp "$SRC/index.html" "$SRC/manifest.json" www/
          cp "$SRC"/icon-*.png www/
          SND=0
          [ -f "$SRC/adhan.mp3" ] && SND=1
          sed -i "s/__SOUND__/$SND/" www/index.html
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7
          npx cap init "رِواء" com.riwaa.app --web-dir=www
          npx cap add android
          R=android/app/src/main/res
          if [ "$SND" = "1" ]; then mkdir -p $R/raw; cp "$SRC/adhan.mp3" $R/raw/adhan.mp3; fi
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n</manifest>#' $M
          rm -rf $R/mipmap-anydpi-v26
          for n in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p $R/mipmap-$n
            for f in ic_launcher ic_launcher_round; do cp www/icon-192.png $R/mipmap-$n/$f.png; done
          done
          for f in ic_launcher ic_launcher_round; do cp www/icon-512.png $R/mipmap-xxxhdpi/$f.png; done
          npx cap sync android
          if [ -f "$SRC/debug.keystore" ]; then mkdir -p ~/.android; cp "$SRC/debug.keystore" ~/.android/debug.keystore; fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: riwaa-apk
          path: /tmp/cap/android/app/build/outputs/apk/debug/app-debug.apk
          
