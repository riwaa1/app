name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'adhan.mp3'
      - 'icon-*.png'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/native-android.sh'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.json adhan.mp3 icon-*.png www/

      - name: Install dependencies
        run: npm install

      - name: Create fresh Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Set app name and icon
        run: |
          RES=android/app/src/main/res
          sudo apt-get install -y imagemagick > /dev/null
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">رِواء</string>#' $RES/values/strings.xml
          sed -i 's#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">رِواء</string>#' $RES/values/strings.xml
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=${d%%:*}
            size=${d##*:}
            convert icon-512.png -resize ${size}x${size} $RES/mipmap-$dir/ic_launcher.png
            cp $RES/mipmap-$dir/ic_launcher.png $RES/mipmap-$dir/ic_launcher_round.png
          done
          rm -f $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Apply native RiwaaAlarm code
        run: |
          bash .github/native-android.sh
          P=android/app/src/main/java/com/riwaa/app
          sed -i 's/openBatterySettings/requestIgnoreBattery/' $P/AlarmPlugin.java
          sed -i '/setOnlyAlertOnce(false)/d' $P/AlarmReceiver.java
          mkdir -p android/app/src/main/res/raw
          cp adhan.mp3 android/app/src/main/res/raw/adhan.mp3

      - name: Sync into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: riwaa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
