name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'adhan.mp3'
      - 'icon-*.png'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check android project
        run: |
          if [ ! -d android ]; then
            echo "::error::مجلد android غير موجود. ارفعه إلى جذر المستودع."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files (no owner panel, no service worker)
        run: |
          mkdir -p www
          cp index.html manifest.json adhan.mp3 icon-*.png www/

      - name: Install dependencies
        run: npm install

      - name: Sync into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: riwaa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
